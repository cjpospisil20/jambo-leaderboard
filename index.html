<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jambo Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:      #fff0a2;
    --cream-deep: #f3d84a;
    --olive:      #4a6c9b;
    --olive-deep: #375581;
    --olive-wash: #e4ebf4;
    --sky:        #afc0d3;
    --sky-wash:   #afc0d3;
    --ink:        #22231a;
    --ink-soft:   #6b6a56;
    --outline:    #17180f;
    --line:       rgba(23,24,15,0.55);
    --line-heavy: #17180f;
    --script:     "Yellowtail", "Brush Script MT", cursive;
    font-family: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }

  /* vintage travel-poster caps: heavy, tight, dark outline via stroke behind fill */
  .poster-outline {
    -webkit-text-stroke: 0.6px var(--outline);
    paint-order: stroke fill;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #7f9fb8;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .page {
    position: relative;
    z-index: 2;
    max-width: 100%;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 1.5vh, 20px) clamp(12px, 2vw, 48px);
    gap: clamp(4px, 1vh, 12px);
  }

  .scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .scene svg { width: 100%; height: 100%; display: block; }

  .poster-frame {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    border: clamp(14px, 1.7vw, 30px) solid #e8dbb4;
    box-shadow: inset 0 0 0 2px rgba(23,24,15,0.72);
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(2px, 0.6vh, 8px);
    flex-wrap: wrap;
    flex: 0 0 auto;
    margin-bottom: 0;
  }
  .brand h1 {
    margin: 0;
    font-family: var(--script);
    font-size: clamp(38px, 10.5vh, 180px);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 0.95;
    text-transform: none;
    color: #fbe67b;
  }
  .brand h1 span { color: #fbe67b; }
  .brand p {
    margin: 0;
    font-size: clamp(11px, 1vw, 22px);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    -webkit-text-stroke: 0.5px var(--outline);
    paint-order: stroke fill;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(11px, 1vw, 22px);
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .status .dot {
    width: 9px; height: 9px;
    border-radius: 0;
    background: var(--olive);
  }
  .status .dot.live  { background: #3f7d4f; }
  .status .dot.error { background: #c07a2b; }
  .badge-demo {
    display: inline-flex;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--outline);
    background: var(--cream-deep);
    border: 2px solid var(--outline);
    padding: 6px 13px;
    border-radius: 0;
  }

  /* ---------- board ---------- */
  .board {
    background: #f4ead0;
    border: 3px solid var(--outline);
    border-radius: 0;
    overflow: hidden;
    box-shadow: 6px 6px 0 rgba(23,24,15,0.28);
    flex: 0 0 auto;
    min-height: 0;
  }
  .scroll { overflow: hidden; height: 100%; }

  table {
    width: 100%;
    height: auto;
    border-collapse: collapse;
    min-width: 0;
    table-layout: fixed;
  }

  thead tr.group th {
    background: #f4ead0;
    color: var(--olive);
    font-family: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(12px, 1.3vw, 30px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: clamp(4px, 0.7vh, 10px) 6px;
    border-bottom: 3px solid var(--outline);
    text-align: center;
    -webkit-text-stroke: 0.4px var(--outline);
    paint-order: stroke fill;
  }
  thead tr.group th.spacer { background: #f4ead0; -webkit-text-stroke: 0; }

  thead tr.cols th {
    background: var(--olive);
    color: #fff2ab;
    font-family: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(11px, 1.2vw, 28px);
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.05;
    text-transform: uppercase;
    padding: clamp(5px, 0.8vh, 12px) 6px;
    text-align: center;
    white-space: normal;
    position: sticky;
    top: 0;
    -webkit-text-stroke: 0.4px var(--outline);
    paint-order: stroke fill;
  }
  thead tr.cols th.team-h { text-align: left; }

  tbody td {
    padding: clamp(3px, 1.15vh, 24px) 6px;
    text-align: center;
    border-bottom: 1.5px solid var(--line);
    white-space: nowrap;
    font-weight: 400;
    font-size: clamp(13px, 1.5vw, 34px);
    -webkit-text-stroke: 0.3px var(--outline);
    paint-order: stroke fill;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td.team {
    text-align: left;
    font-weight: 400;
    color: var(--ink);
    white-space: nowrap;
    font-size: clamp(12px, 1.3vw, 30px);
    width: 19%;
  }
  thead tr.cols th.team-h { width: 19%; }
  tbody td.rank { font-weight: 400; color: var(--olive); width: 4%; }
  tbody td.points { font-weight: 400; font-size: clamp(15px, 1.7vw, 38px); width: 6%; }
  tbody td.muted { color: var(--ink-soft); -webkit-text-stroke: 0.3px var(--outline); }

  /* group dividers */
  td.divide, th.divide { border-left: 3px solid var(--outline); }

  /* alternating wash */
  tbody tr:nth-child(even) td { background: var(--sky-wash); }

  /* leader row intentionally styled the same as the other odd rows */

  /* points tie: highlight team name + points cells (dark green, white text) */
  tbody td.tie {
    background: #567233 !important;
    color: #fff !important;
    -webkit-text-stroke: 0 !important;
  }

  .check { font-size: clamp(20px, 2vw, 44px); line-height: 1; display: inline-block; -webkit-text-stroke: 0; color: #111; }
  .check.on  { color: #111; }
  .check.off { color: #111; }

  .footnote {
    margin: 0;
    flex: 0 0 auto;
    font-size: clamp(11px, 1vw, 22px);
    color: var(--ink);
    letter-spacing: 0.04em;
    text-align: center;
    -webkit-text-stroke: 0.4px var(--outline);
    paint-order: stroke fill;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  /* ---------- mobile / touch: allow scrolling, readable fonts ---------- */
  /* Big monitors driven by a computer keep the locked one-screen layout above;
     phones/tablets (touch) or narrow windows fall through to this. */
  @media (pointer: coarse), (max-width: 819px) {
    html, body { overflow: auto; height: auto; }
    .page {
      display: block;
      height: auto;
      padding: 16px;
      gap: 0;
    }
    .masthead { margin-bottom: 14px; }
    .brand h1 { font-size: clamp(34px, 12vw, 64px); }
    .controls { width: 100%; justify-content: center; }

    .board { flex: none; }
    .scroll { overflow-x: auto; overflow-y: visible; height: auto; -webkit-overflow-scrolling: touch; }

    table { table-layout: auto; width: auto; min-width: 720px; height: auto; }

    thead tr.group th { font-size: 13px; padding: 8px 8px; }
    thead tr.cols th  { font-size: 13px; padding: 9px 8px; }
    tbody td {
      font-size: 16px;
      padding: 10px 8px;
      white-space: nowrap;
    }
    tbody td.team   { font-size: 15px; width: auto; }
    thead tr.cols th.team-h { width: auto; }
    tbody td.rank   { width: auto; }
    tbody td.points { font-size: 18px; width: auto; }
    .check { font-size: 24px; }
    .footnote { font-size: 13px; margin-top: 14px; }
  }
</style>
</head>

<div class="page">

  <header class="masthead">
    <div class="brand">
      <h1>Jambo <span>Leaderboard</span></h1>
      <p>Live scores</p>
    </div>
    <div class="controls">
      <span class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Loading…</span>
      </span>
    </div>
  </header>

  <div class="board">
    <div class="scroll"><div id="mount"></div></div>
  </div>

  <p class="footnote">Updates automatically from the live sheet every 30 seconds.</p>
</div>

<script>
/* ============================================================
   LIVE BUILD — pulls the "Leaderboard" tab of the Google Sheet
   as CSV (gviz endpoint) and re-renders every 30 seconds.
   Requires the sheet to be shared "anyone with link can view".
   ============================================================ */

const SHEET_ID = "1ui5a6mI18m_ZzgXZSi-G6cmHyq385iE6KvLz1C8kYaQ";
const SHEET_GID = "1296888730"; // "Leaderboard" tab
const REFRESH_MS = 30000;

/* column grouping — matched by header name, so it survives column shifts */
const BONUS_COLS     = ["costume", "beach bocce", "double", "skunk given", "skunk taken", "other"];
const POTENTIAL_COLS = ["double used", "potential", "real potential"];
const CHECK_COL      = "double used";

/* ---------- CSV parsing (handles quotes, commas, newlines) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  row.push(field);
  rows.push(row);
  return rows;
}

const norm = s => String(s || "").trim().toLowerCase();

/* ---------- locate the real table inside the sheet ---------- */
function locateColumns(rows) {
  let headerIdx = -1;
  for (let r = 0; r < rows.length; r++) {
    if (rows[r].some(c => norm(c).includes("team"))) { headerIdx = r; break; }
  }
  if (headerIdx === -1) return null;

  const headerRow = rows[headerIdx];
  const cols = [];
  headerRow.forEach((cell, idx) => {
    const label = String(cell).trim();
    if (label !== "") cols.push({ idx, label });
  });
  if (cols.length === 0) return null;

  cols.forEach(col => {
    const n = norm(col.label);
    if (n.includes("team")) col.kind = "team";
    else if (n === "rank")  col.kind = "rank";
    else if (n === "points" || n === "pts") col.kind = "points";
    else col.kind = "plain";
    col.isCheck = n.includes(CHECK_COL);
    if (POTENTIAL_COLS.some(p => n.includes(p)))      col.group = "POTENTIAL";
    else if (BONUS_COLS.some(b => n.includes(b)))     col.group = "BONUS";
    else col.group = "STANDINGS";
  });

  const teamCol = cols.find(c => c.kind === "team");

  const dataRows = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const team = String(rows[r][teamCol.idx] || "").trim();
    if (team === "") continue;
    dataRows.push(rows[r]);
  }

  return { cols, dataRows };
}

/* ---------- render ---------- */
function truthy(v) {
  const n = norm(v);
  return n === "true" || n === "yes" || n === "x" || n === "1" || n === "✓" || n === "☑";
}

function renderTable(model) {
  const { cols, dataRows } = model;

  let groupCells = "", prevGroup = null;
  cols.forEach((col, i) => {
    const g = col.group;
    const startsGroup = g && g !== prevGroup;
    const divide = (i > 0 && col.group !== cols[i - 1].group) ? " divide" : "";
    if (g) {
      if (startsGroup) {
        const span = cols.filter(c => c.group === g).length;
        groupCells += '<th class="group-band' + divide + '" colspan="' + span + '">' + g + '</th>';
      }
    } else {
      groupCells += '<th class="spacer' + divide + '"></th>';
    }
    prevGroup = g;
  });

  const colCells = cols.map((col, i) => {
    const divide = (i > 0 && col.group !== cols[i - 1].group) ? " divide" : "";
    const teamH = col.kind === "team" ? " team-h" : "";
    // "BONUS COSTUME" is redundant under the BONUS band — show just "Costume"
    const displayLabel = norm(col.label) === "bonus costume" ? "Costume" : col.label;
    // stack multi-word headers onto separate lines to keep columns narrow
    const stacked = displayLabel.split(/\s+/).map(escapeHtml).join("<br>");
    return '<th class="' + teamH + divide + '">' + stacked + '</th>';
  }).join("");

  const rankCol   = cols.find(c => c.kind === "rank");
  const pointsCol = cols.find(c => c.kind === "points");

  // A true tie is an exact match on the FULL points value including the hidden
  // decimal tie-breaker (e.g. two teams both at 10.000011). Teams that merely
  // round to the same integer but differ in the decimals are NOT tied.
  // Not-yet-scored rows (blank / rounds to 0) never highlight.
  const tieValues = new Set();
  if (pointsCol) {
    const counts = {};
    dataRows.forEach(dr => {
      const v = String(dr[pointsCol.idx] == null ? "" : dr[pointsCol.idx]).trim();
      const n = parseFloat(v);
      if (!isFinite(n) || Math.round(n) === 0) return;
      counts[v] = (counts[v] || 0) + 1;
    });
    Object.keys(counts).forEach(k => { if (counts[k] >= 2) tieValues.add(k); });
  }

  const body = dataRows.map((r, rowIdx) => {
    let isLeader = rankCol
      ? String(r[rankCol.idx]).trim() === "1"
      : rowIdx === 0;

    const rowPts = pointsCol
      ? String(r[pointsCol.idx] == null ? "" : r[pointsCol.idx]).trim()
      : "";
    const isTie = tieValues.has(rowPts);

    const tds = cols.map((col, i) => {
      const raw = String(r[col.idx] == null ? "" : r[col.idx]).trim();
      const divide = (i > 0 && col.group !== cols[i - 1].group) ? " divide" : "";
      const tie = (isTie && (col.kind === "team" || col.kind === "points")) ? " tie" : "";

      if (col.isCheck) {
        const on = truthy(raw);
        return '<td class="' + divide + '"><span class="check ' + (on ? "on" : "off") + '">' + (on ? "☑" : "☐") + '</span></td>';
      }
      if (col.kind === "team")   return '<td class="team' + divide + tie + '">' + escapeHtml(raw || "—") + '</td>';
      if (col.kind === "rank")   return '<td class="rank' + divide + '">' + escapeHtml(raw || "—") + '</td>';
      if (col.kind === "points") {
        // display the clean rounded score; the decimal tie-breaker stays hidden
        const n = parseFloat(raw);
        const shown = (raw === "" || !isFinite(n)) ? "0" : String(Math.round(n));
        return '<td class="points' + divide + tie + '">' + escapeHtml(shown) + '</td>';
      }

      const muted = (raw === "" || raw === "0") ? " muted" : "";
      return '<td class="' + muted + divide + '">' + escapeHtml(raw === "" ? "—" : raw) + '</td>';
    }).join("");

    return '<tr class="' + (isLeader ? "leader" : "") + '">' + tds + '</tr>';
  }).join("");

  return '' +
    '<table>' +
      '<thead>' +
        '<tr class="group">' + groupCells + '</tr>' +
        '<tr class="cols">' + colCells + '</tr>' +
      '</thead>' +
      '<tbody>' + body + '</tbody>' +
    '</table>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* ---------- live fetch + auto-refresh ---------- */
const mount = document.getElementById("mount");
const statusDot  = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

let hasRendered = false;

function csvUrl() {
  // cache-bust so browser/Google caches don't mask fresh scores
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
         "/gviz/tq?tqx=out:csv&gid=" + SHEET_GID + "&_=" + Date.now();
}

function fmtTime(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + " " + ampm;
}

function setStatus(state, text) {
  statusDot.className = "dot" + (state ? " " + state : "");
  statusText.textContent = text;
}

async function load() {
  try {
    const res = await fetch(csvUrl(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const model = locateColumns(parseCSV(text));
    if (!model) throw new Error("Could not locate leaderboard table");
    mount.innerHTML = renderTable(model);
    hasRendered = true;
    setStatus("live", "Live · updated " + fmtTime(new Date()));
  } catch (err) {
    // keep the last good board on screen; only show a message if we have nothing yet
    if (!hasRendered) {
      mount.innerHTML =
        '<p style="padding:24px 16px;text-align:center;">' +
        'Couldn’t reach the sheet — retrying…</p>';
    }
    setStatus("error", "Reconnecting…");
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
